<h2>一、问题：今天的 AI 其实"看不见"</h2>
<h2>一、问题：今天的 AI 其实"看不见"</h2>
<p>现在多数多模态模型处理图片的方式是：看一眼，转成 token，后面全靠文字推理。就像凭记忆描述一张昨天瞥过的照片。</p>
<p>Elorian 合作的一个测试很说明问题：Humanity's Sixth Sense，522 道纯视觉题，GPT-6 Astra 得分 53.6，人类平均 93.1。差的不是语言能力，是"看"这个环节。</p>
<p>我的判断：过去两年多模态的进步主要在"说"，不在"看"。Glimpse 赌的是下一站——让模型在推理过程中反复回到图像本身。</p>
</body></html>
