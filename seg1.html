<p>去年，Elorian 创始人 Andrew Dai 给一桌桌游拍了张照片，问一个前沿 AI 模型：这局谁赢了。模型答不上来。棋子散落各处，答案明明藏在细节里——但模型只"看"了一眼，把画面转成文字 token，之后就全靠记忆推理了。</p>
<p>这件事成了 Glimpse 的起点。10 月 16 日，Elorian 发布了自己的第一个模型 Glimpse：一个会在思考中途"回头看"图的视觉推理模型。我看了官方博客和 Prompt &amp; Profit 的讲解视频，把值得知道的东西拆成这一篇。</p>
